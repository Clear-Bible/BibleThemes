[project]
name = "dbt"
version = "0.1.0"
description = "Public data for processing Manser's Dictionary of Bible Themes"
authors = [
    {name = "Sean Boisen", email = "sean.boisen@biblica.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jupyterlab>=4.3.4",
    "nbclassic>=1.1.0",
    "jupyter-server-ydoc>=1.1.0",
    "jupyter-server-fileid>=0.9.3",
    "mkdocstrings>=0.27.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
]

[project.urls]
Repository = "https://github.com/Clear-Bible/BibleThemes"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "mypy>=0.981",
    "pre-commit>=2.20.0",
    "tox>=3.25.1",
]
docs = [
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py39']
preview = true

[tool.isort]
profile = "black"

[tool.mypy]
files = ["src"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
